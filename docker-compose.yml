services:
  postgres:
    image: postgres:16
    profiles: [infra]
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: riadom
      POSTGRES_PASSWORD: riadom
      POSTGRES_DB: riadom
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U riadom -d riadom']
      interval: 5s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    profiles: [infra]
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
    volumes:
      - rustfs_data:/data
    command: ['/data']
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ngrok:
    profiles: [ngrok]
    image: ngrok/ngrok:latest
    command:
      - http
      - --url=https://${NGROK_DOMAIN}
      - host.docker.internal:3000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - '4040:4040'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  postgres_data:
  rustfs_data:
