services:
  postgres:
    image: postgres:16
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: riadom
      POSTGRES_PASSWORD: riadom
      POSTGRES_DB: riadom
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U riadom -d riadom']
      interval: 5s
      timeout: 5s
      retries: 5

  ngrok:
    profiles: [ngrok]
    image: ngrok/ngrok:latest
    command:
      - http
      - --url=https://${NGROK_DOMAIN}
      - host.docker.internal:3000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - '4040:4040'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  postgres_data:
